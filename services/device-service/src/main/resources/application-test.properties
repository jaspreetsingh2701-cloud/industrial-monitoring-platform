# Test server port (used only when a test starts the web server)
server.port=8082

# Keep test logs concise
logging.level.root=WARN

# Use a separate PostgreSQL database for tests.
# Create industrial_monitoring_test before activating this profile.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/industrial_monitoring_test}
spring.datasource.username=${TEST_DB_USERNAME:monitoring}
spring.datasource.password=${TEST_DB_PASSWORD}

# Recreate the test schema for each application context.
spring.jpa.hibernate.ddl-auto=create-drop
