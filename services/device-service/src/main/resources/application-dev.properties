# Local development server
server.port=8081

# Detailed logs for our application code
logging.level.com.monitoring.device=DEBUG

# Local Docker PostgreSQL
# Override these values with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/industrial_monitoring}
spring.datasource.username=${DB_USERNAME:monitoring}
spring.datasource.password=${DB_PASSWORD}

# Update the local schema while developing.
# We will replace this with Flyway migrations later.
spring.jpa.hibernate.ddl-auto=update
