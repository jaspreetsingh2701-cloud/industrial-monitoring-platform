# Identify this microservice in application logs and monitoring.
spring.application.name=device-service

# Change the embedded Tomcat port from 8080 to 8081.
server.port=8081

# Set the default logging threshold to INFO.
logging.level.root=INFO

# Enable DEBUG logs for our Device Service code.
logging.level.com.monitoring.device=DEBUG

# Keep Spring framework logs at INFO.
logging.level.org.springframework=INFO

# Read the database URL from the environment; use a local default if absent.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/industrial_monitoring}

# Read the database username from the environment.
spring.datasource.username=${DB_USERNAME:postgres}

# Read the database password from the environment.
spring.datasource.password=${DB_PASSWORD:}
